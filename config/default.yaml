server:
  host: "0.0.0.0"
  port: 8000
  workers: 1
  log_level: "info"

auth:
  enabled: true
  api_keys:
    - name: "dev"
      key: "${API_KEY_DEV:-dev-key-123}"
      rate_limit: "100/minute"

versioning:
  enabled: false
  rollback:
    error_threshold: 0.05
    latency_threshold_ms: 500
    window_seconds: 60

batching:
  enabled: true
  max_batch_size: 32
  timeout_ms: 10

models:
  - name: "default_model"
    source: "local"
    path: "./models/model.pkl"
    framework: "auto"
    device: "auto"
    warmup: true
    weight: 100
